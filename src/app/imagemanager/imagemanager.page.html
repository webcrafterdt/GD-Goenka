<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="teacherhome"></ion-back-button>
    </ion-buttons>
    <ion-title>Image Manager</ion-title>
  </ion-toolbar>

  <ion-segment [(ngModel)]="category" style="background-color:#e4f3f7!important">
    <ion-segment-button value="applicationlist" style="border:none;color:black;font-size:12px"
      (click)="applied_leaves()">
      ADD CAT/SUB CAT
    </ion-segment-button>
    <ion-segment-button value="writeapplication" style="border:none;color:black;font-size:12px">
      IMAGE CATEGORY LIST
    </ion-segment-button>

  </ion-segment>
</ion-header>

<ion-content>
  <div>


    <div [ngSwitch]="category">
      <ion-list *ngSwitchCase="'applicationlist'">
        <ng-container>


          <div style="margin-top: 10px; display: flex; gap: 10px;margin-left: 5%;margin-bottom: 3%;">

            <!-- Authorize Button -->
            <ion-button size="small" color="success" (click)="ShowHideCatSubCat('Cat')">
              <!-- <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon> -->
              New Category
            </ion-button>

            <!-- Delete Button -->
            <ion-button size="small" color="danger" (click)="ShowHideCatSubCat('SubCat')">
              <!-- <ion-icon name="trash-outline" slot="start"></ion-icon> -->
              New Sub Category
            </ion-button>

          </div>

          <!-------------------------- Apply Cat/Sub Starts ---------------------------->

          <div>
            <ion-card style="background-color: #F0F5F8;">
              <form [formGroup]="ionicForm" novalidate>
                <ion-list
                  style="margin-top: 5px;margin-left: 1%;margin-right: 1%;width: 98%;background-color: #F0F5F8;">


                  <ion-card class="search-card" style="padding: 4px;" *ngIf="this.ShowType == 'Cat'">
                    <ion-item lines="none" class="search-item" style="padding: 4px 8px;">
                      <textarea placeholder="Category" name="category1" type="text" [(ngModel)]="category1"
                        [ngModelOptions]="{standalone: true}"
                        style="padding-top:12px;width:100%;border:1px solid #8e9099 !important;height: 40px;color:#8e9099;font-size: 12px;border-radius:25px;"
                        required></textarea>
                    </ion-item>
                  </ion-card>
                  <!---->



                  <ion-card class="search-card" style="padding: 4px;" *ngIf="this.ShowType == 'SubCat'">
                    <ion-item lines="none" class="search-item" style="padding: 4px 8px;">
                      <ion-label style="font-size: 11px; font-weight: bold; color: #2c3e50;">
                        Category
                      </ion-label>
                      <ion-select [(ngModel)]="imagecatid" [ngModelOptions]="{ standalone: true }"
                        placeholder="Choose Category" interface="popover" ok-text="Select"
                        (ionChange)="getTransid($event)" cancel-text="Cancel">

                        <ion-select-option *ngFor="let imagecats of ImageCategories" [value]="imagecats.imagecatid">
                          {{ imagecats.cat_name }}
                        </ion-select-option>
                      </ion-select>
                    </ion-item>
                  </ion-card>


                  <ion-card class="search-card" style="padding: 4px;" *ngIf="this.ShowType == 'SubCat'">
                    <ion-item lines="none" class="search-item" style="padding: 4px 8px;">
                      <textarea placeholder="Sub Category" name="subcategory" type="text" [(ngModel)]="subcategory"
                        [ngModelOptions]="{standalone: true}"
                        style="padding-top:12px;width:100%;border:1px solid #8e9099 !important;height: 40px;color:#8e9099;font-size: 12px;border-radius:25px;"
                        required></textarea>
                    </ion-item>
                  </ion-card>

                </ion-list>
              </form>



              <!--     
      <ion-item style="margin-top: 5px;">
      <ion-checkbox  name="is_attachment"  (ionChange)="is_attachment_added($event)"></ion-checkbox>
        <ion-label style="font-size: 13px; font-weight: bold; color: #2c3e50;"> &nbsp;&nbsp;Use Attachment</ion-label>
      </ion-item> -->

              <ion-list *ngIf="this.ShowType == 'Cat'">
                <ion-button color="linear-gradient(#007ab3, #055073)" expand="block" size="large" style="border-radius: 5px;height:38px;margin-top:15px;background: linear-gradient(#007ab3, #055073)!important;
      font-size:14px;font-weight:bold;background:linear-gradient(#d8a1c9, #4e79a3)!important;" type="submit"
                  expand="block" (click)="SubmitCat()">SUBMIT</ion-button>
              </ion-list>


              <ion-list *ngIf="this.ShowType == 'SubCat'">
                <ion-button color="linear-gradient(#007ab3, #055073)" expand="block" size="large" style="border-radius: 5px;height:38px;margin-top:15px;background: linear-gradient(#007ab3, #055073)!important;
      font-size:14px;font-weight:bold;background:linear-gradient(#d8a1c9, #4e79a3)!important;" type="submit"
                  expand="block" (click)="SubmitSubCat()">SUBMIT</ion-button>
              </ion-list>

            </ion-card>

          </div>
        </ng-container>
      </ion-list>

      <!--------------------------Apply News Ends ---------------------------->




      <ion-list *ngSwitchCase="'writeapplication'">
        <ng-container>
          <ng-container>

            <div style="width: 100%;    margin-bottom: 17px;padding-bottom: 17px;">
              <div style="float: left;width: 30%;font-weight: bold;color:#47515b;text-align: center;font-size:13px">
                Category List
              </div>


              <!--second ends-->
            </div>



            <ion-row class="custom-row" *ngFor="let ImgCat of ImageCategories; let i = index">
              <ion-col size="12">
                <div style="position: relative; width: 100%; height: 100%;">

                  <!-- Left colored bar -->

                  <div [ngStyle]="{
                'border-top-left-radius': '12px',
                'border-bottom-left-radius': '12px',
                'width': '6%',
                'float': 'left',
                'background-color':  '#BBEDBE' ,
                'height': '100%',
                'display': 'flex',
                'justify-content': 'center',
                'align-items': 'center'
              }">
                  </div>



                  <!-- Homework content -->
                  <div
                    style="width: 92%; float: left; background-color: white; padding: 10px; border-radius: 0 12px 12px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">


                    <p style="font-size:13px;white-space: pre-line;color: black">
                      Category :
                      <b [innerHTML]="decodeHtml(ImgCat.cat_name)"></b>
                    </p>



                    <div style="margin-top: 10px; display: flex; gap: 10px;margin-left: 5%;margin-bottom: 3%;">
                      <ion-button size="small" color="success" (click)="AttachemtnView(ImgCat.imagecatid)">
                        Add Image
                      </ion-button>
                      <!-- <ion-button size="small" color="warning" (click)="EditCategory(ImgCat)">
                        <ion-icon name="create-outline" slot="start"></ion-icon>
                        Edit
                      </ion-button> -->
                    </div>

                    <div style="display: flex; justify-content: flex-end; width: 100%; margin-top: 10px;">
                      <ion-button size="small" class="custom-btn" style="font-size: 12px; padding: 4px 8px;"
                        (click)="SubCategory(ImgCat.imagecatid)">
                        Sub Category >
                      </ion-button>
                    </div>





                  </div>

                </div>
              </ion-col>
            </ion-row>
          </ng-container>
        </ng-container>
      </ion-list>


    </div>


  </div>




  <!-- <ion-list style="background-color: #F0F5F8;" *ngIf="this.status == false">
    <ion-card>
      <ion-item>
        <div style="width:100%;">
          <h5 style="font-size: 11px;"><b>{{this.message}}</b></h5>
        </div>
      </ion-item>
    </ion-card>
  </ion-list> -->
  <ion-list *ngIf="!isLoading && ImageCategories.length == 0">
    <ion-card>
      <ion-item>
        <div style="width:100%;">
          <h5 style="font-size:11px;"><b>No Image Available..!</b></h5>
        </div>
      </ion-item>
    </ion-card>
  </ion-list>
</ion-content>
