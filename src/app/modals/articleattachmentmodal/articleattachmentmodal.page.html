<ion-list>
  <ion-item
    *ngFor="let img of ArticleAttachments"
    lines="none">

    <div style="
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    ">

      <img
        [src]="img.article_file_path"
        style="
          max-width: 100%;
          max-height: 250px;
          border-radius: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.15);
          object-fit: contain;
        "
        alt="Article Image" />

    </div>

  </ion-item>
</ion-list>

</ion-content>
