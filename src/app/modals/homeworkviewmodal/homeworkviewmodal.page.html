<ion-header>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button (click)="closeModel()" [strong]="true">close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- 🔹 Data -->
  <ion-list>
    <ion-item *ngFor="let homework1 of homework" lines="none" class="homework-item">
      <div style="display: flex; width: 100%; background-color: white; border-radius: 8px; overflow: hidden;">
        <div style="width: 6%; background-color: #F1B9AC;"></div>
        <div style="flex: 1; padding: 10px;">
          <p style="font-size: 13px; color: black; margin: 0;">
            <b [innerHTML]="decodeHtml(homework1.Title)"></b>
          </p>
          <p style="margin-top: 5px; font-size: 11px; color: gray;">
            Subject: {{ homework1.SubjectName }}
          </p>
          <p style="margin-top: 5px; font-size: 11px; color: gray;">
            Apply Date: {{ homework1.applydate }}
          </p>
          <p style="margin-top: 5px; font-size: 11px; color: gray;">
            Completion Date: {{ homework1.completiondate }}
          </p>
          <p style="margin-top: 5px; font-size: 11px; color: gray;">
            Classes: {{ homework1.Classes }}
          </p>
          <h6 style="height: 15px;" *ngIf="homework1.IsHomeWork == 'Y'">
            <ion-icon name="document-outline" style="color: #055073" (click)="opefile(homework1.homework_file)"></ion-icon>
          </h6>
          <p style="margin-top: 5px; font-size: 11px; color: gray;">
            Content: <span style="font-weight: bold;" [innerHTML]="decodeHtml(homework1.details)"></span>
          </p>
        </div>
      </div>
    </ion-item>
  </ion-list>

</ion-content>
