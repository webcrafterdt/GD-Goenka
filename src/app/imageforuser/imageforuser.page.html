<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="teacherhome"></ion-back-button>
    </ion-buttons>
    <ion-title>{{this.ImageCategoryName}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content style="--background: #f4f5f8;">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" pullingText="Pull to refresh"
      refreshingSpinner="circles" refreshingText="Fetching latest ImageSubCategory...">
    </ion-refresher-content>
  </ion-refresher>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let imguser of ImageForUser; let i = index">

        <div (click)="AttachemtnView(imguser.Cat_ID,imguser.Cat_Name)"
          style="background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 10px; position: relative; height: 100%;">

          <div
            style="width: 100%; height: 120px; overflow: hidden; background: #eee; display: flex; align-items: center; justify-content: center;">
            <img src="assets/thumbnail.jpg" style="width: 100%; height: 100%; object-fit: cover;">
          </div>

          <div style="padding: 10px; text-align: center;">
            <!-- <p style="margin: 0; font-size: 13px; font-weight: bold; color: #333; line-height: 1.2;">
              {{ decodeHtml(imguser.Cat_Name) }}
            </p> -->
            <p style="margin: 0; font-size: 13px; font-weight: bold; color: #333; line-height: 1.2;">
              {{ decodeHtml(imguser.Cat_Name)?.length > 50
              ? (decodeHtml(imguser.Cat_Name) | slice:0:50) + '...'
              : decodeHtml(imguser.Cat_Name) }}
            </p>
            <p style="margin: 4px 0 0; font-size: 11px; color: #3880ff; font-weight: 500;">
              ({{ imguser.Total_images }} Images)
            </p>
          </div>

          <div
            style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.4); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 10px;">
            <ion-icon name="image-outline"></ion-icon>
          </div>
        </div>

      </ion-col>
    </ion-row>
  </ion-grid>

  <div *ngIf="!isLoading && ImageForUser.length == 0" style="padding: 20px; text-align: center;">
    <ion-card mode="ios">
      <ion-item lines="none">
        <ion-label style="text-align: center; color: gray;">No Image Available..!</ion-label>
      </ion-item>
    </ion-card>
  </div>

</ion-content>
