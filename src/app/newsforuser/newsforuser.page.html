<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="teacherhome"></ion-back-button>
    </ion-buttons>
    <ion-title>News Manager</ion-title>
  </ion-toolbar>


</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" pullingText="Pull to refresh"
      refreshingSpinner="circles" refreshingText="Fetching latest news...">
    </ion-refresher-content>
  </ion-refresher>
  <div>




    <!--------------------------Apply News Ends ---------------------------->





    <ion-list>
      <ng-container>
        <ng-container>
          <ion-row class="custom-row" *ngFor="let News of NewsList; let i = index">
            <ion-col size="12">
              <div style="position: relative; width: 100%; height: 100%;">

                <!-- Left colored bar -->
                <div style="border-top-left-radius: 12px;
                     border-bottom-left-radius: 12px;
                     width: 6%;
                     float: left;
                     background-color: #F1B9AC;
                     height:100%;
                     display: flex;
                     justify-content: center;
                     align-items: center;">
                </div>

                <!-- Homework content -->
                <div
                  style="width: 92%; float: left; background-color: white; padding: 10px; border-radius: 0 12px 12px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
                  <p style="font-size:13px;white-space: pre-line;color: black">
                    <b [innerHTML]="decodeHtml(News.author)"></b>
                  </p>
                  <p style="margin-top: 5px;font-size:11px !important;color:gray;">News Subject:
                    {{News.newssubject}}
                  </p>
                  <p style="margin-top: 5px;font-size:11px !important;color:gray;">Author:
                    {{News.author}}
                  </p>
                  <p style="margin-top: 5px;font-size:11px !important;color:gray;">Date:
                    {{News.datepost}}
                  </p>
                  <p style="margin-top: 5px;font-size:11px !important;color:gray;">Matter:
                    <b [innerHTML]="decodeHtml(News.matter)"></b>

                    <!-- <ion-button fill="clear" size="small" color="primary" (click)="editHomework(homework.homeworkid)" style="float: right;">
                  <ion-icon name="create-outline" slot="icon-only"></ion-icon>
                </ion-button> -->

                    <!-- <ion-button fill="clear" size="small" color="danger" (click)="deleteHomework(homework.homeworkid)" style="float: right;">
                  <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-button> -->
                  </p>




                </div>

              </div>
            </ion-col>
          </ion-row>
        </ng-container>
      </ng-container>
    </ion-list>





  </div>

  <!-- <ion-list *ngIf="!NewsList || NewsList.length == 0" style="background-color: #F0F5F8;">
    <ion-card>
      <ion-item>
        <div style="width:100%;">
          <h5 style="font-size: 11px;"><b>No News Available..!</b></h5>
        </div>
      </ion-item>
    </ion-card>
  </ion-list> -->
  <ion-list *ngIf="!isLoading && NewsList.length == 0">
    <ion-card>
      <ion-item>
        <div style="width:100%;">
          <h5 style="font-size:11px;"><b>No News Available..!</b></h5>
        </div>
      </ion-item>
    </ion-card>
  </ion-list>

  <!-- <ion-list style="background-color: #F0F5F8;" *ngIf="this.status == false">
    <ion-card>
      <ion-item>
        <div style="width:100%;">
          <h5 style="font-size: 11px;"><b>{{this.message}}</b></h5>
        </div>
      </ion-item>
    </ion-card>
  </ion-list> -->
</ion-content>
